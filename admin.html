<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PASTIBOS Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="brand">PASTI<span>BOS</span></div>
    <div class="login-sub">ADMIN CONTROL CENTER</div>
    <input id="loginUser" autocomplete="username" placeholder="Username Admin">
    <input id="loginPass" type="password" autocomplete="current-password" placeholder="Password Admin">
    <button class="btn primary" onclick="adminLogin()">MASUK</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="side-head">
      <div class="side-brand">PASTI<span>BOS</span></div>
      <button class="close-side" onclick="closeSidebar()">×</button>
    </div>
    <div class="side-admin">Admin: <b id="adminName">-</b></div>
    <nav>
      <button class="nav-item active" data-page="members" onclick="showPage('members')">👥 <span>Daftar Member</span></button>
      <button class="nav-item" data-page="settings" onclick="showPage('settings')">⚙️ <span>Setting Member</span></button>
      <button class="nav-item" data-page="transactions" onclick="showPage('transactions')">💰 <span>Transaksi Member</span></button>
    </nav>
    <button class="logout" onclick="logout()">🚪 Keluar</button>
  </aside>
  <div id="overlay" class="overlay" onclick="closeSidebar()"></div>

  <header class="topbar">
    <button class="hamburger" onclick="openSidebar()">☰</button>
    <div class="top-title">PASTIBOS <small>ADMIN</small></div>
    <button class="refresh" onclick="refreshCurrent()">↻</button>
  </header>

  <main class="content">
    <section id="page-members" class="page">
      <div class="page-title"><div><h1>Daftar Member</h1><p>Member terbaru berada paling atas.</p></div><span id="memberCount" class="count">0 Member</span></div>
      <div class="search"><input id="memberSearch" placeholder="🔎 Cari username / HP..." oninput="renderMembers()"></div>
      <div id="memberList" class="list"></div>
    </section>

    <section id="page-settings" class="page hidden">
      <div class="page-title"><div><h1>Setting Member</h1><p>Pilih member untuk mengubah data akun.</p></div></div>
      <div class="search"><input id="settingSearch" placeholder="🔎 Cari member..." oninput="renderSettings()"></div>
      <div id="settingList" class="list"></div>
    </section>

    <section id="page-transactions" class="page hidden">
      <div class="page-title"><div><h1>Transaksi Member</h1><p>Deposit dan Withdraw seluruh member.</p></div><span id="trxCount" class="count">0</span></div>
      <div class="filters">
        <button class="filter active" onclick="filterTrx('ALL',this)">SEMUA</button>
        <button class="filter" onclick="filterTrx('TOPUP',this)">DEPOSIT</button>
        <button class="filter" onclick="filterTrx('WITHDRAW',this)">WITHDRAW</button>
        <button class="filter" onclick="filterTrx('PENDING',this)">PENDING</button>
      </div>
      <div id="trxList" class="list"></div>
    </section>
  </main>
</div>

<div id="detailModal" class="modal hidden"><div class="modal-card">
  <button class="modal-close" onclick="closeModal('detailModal')">×</button>
  <h2>Detail Member</h2><div id="detailBody"></div>
</div></div>

<div id="editModal" class="modal hidden"><div class="modal-card">
  <button class="modal-close" onclick="closeModal('editModal')">×</button>
  <h2>Setting Member</h2>
  <input type="hidden" id="editId">
  <label>Username</label><input id="editUsername" disabled>
  <label>Nomor HP</label><input id="editPhone">
  <label>Bank / E-Wallet</label><input id="editBank">
  <label>Nama Pemilik</label><input id="editAccountName">
  <label>Nomor Rekening</label><input id="editAccountNumber">
  <label>Status</label><select id="editStatus"><option value="active">ACTIVE</option><option value="suspended">SUSPENDED</option></select>
  <button class="btn primary" onclick="saveMember()">💾 SIMPAN PERUBAHAN</button>
  <div id="editMsg" class="msg"></div>
</div></div>

<div id="toast"></div>
<script src="/admin.js"></script>
</body>
</html>
